server:
  port: ${PORT:8080}
  # Cloud Run termina o HTTPS e repassa em HTTP com X-Forwarded-Proto/Host. Sem isto o Spring acha que
  # https://<app>.run.app é outra origem e recusa POST/PUT/DELETE do navegador com 403 "Invalid CORS request".
  forward-headers-strategy: framework
  error:
    include-stacktrace: never

spring:
  application:
    name: moldelab
  # Sem variáveis de ambiente: H2 em arquivo (desenvolvimento local).
  # Produção: DATABASE_URL=jdbc:postgresql://host:5432/banco?sslmode=require, DATABASE_USERNAME, DATABASE_PASSWORD
  datasource:
    url: ${DATABASE_URL:jdbc:h2:file:./data/moldelab;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH}
    username: ${DATABASE_USERNAME:sa}
    password: ${DATABASE_PASSWORD:}
    hikari:
      # bancos gratuitos limitam conexões; poucas bastam
      maximum-pool-size: ${DATABASE_POOL_SIZE:5}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    # {vendor} = h2 ou postgresql
    locations: classpath:db/migration/{vendor}
  servlet:
    multipart:
      max-file-size: 8MB
      max-request-size: 9MB
  jackson:
    default-property-inclusion: non_null

management:
  endpoints:
    web:
      exposure:
        include: health

moldelab:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  ai:
    enabled: true
    model: claude-opus-5-5
    timeout-seconds: 90
